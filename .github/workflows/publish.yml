# Release workflow for the React Native SDK (npm package `@lockally/react-native`).
#
# TEMPLATE — inert in this monorepo. Copy to `.github/workflows/publish.yml` in
# the SDK's own repo (github.com/lockallyinc/lockally-react-native). Tag-driven:
# push `vX.Y.Z`.
#
# One-time setup in that repo:
#   - Add repo secret NPM_TOKEN = an npm automation token scoped to the
#     @lockally org. Claude never handles this token.
#   - `id-token: write` enables npm provenance — no extra secret needed.
name: Publish npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
